<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>ArgusPlaybook</Name>
    <Username>Argus</Username>
    <Title>Argus Playbook v1.0.2</Title>
    <ShortDescription>Professional Windows customization for performance, privacy, gaming, and development.</ShortDescription>
    <Description>Argus Playbook is a carefully engineered AME Wizard playbook that optimizes Windows 11 for performance, responsiveness, privacy, gaming, and development workflows.</Description>
    <Details>Professional, auditable Windows customization. All changes are reversible. Designed for Windows 11 24H2 and 25H2.</Details>
    <ProgressText>Argus is applying your selected Windows customizations. This process typically takes 10-20 minutes. Do not interrupt the process.</ProgressText>
    <Version>1.0.2</Version>
    <SupportedBuilds>
        <string>26100</string>
        <string>26200</string>
    </SupportedBuilds>
    <Requirements>
        <Requirement>DefenderToggled</Requirement>
        <Requirement>NoAntivirus</Requirement>
        <Requirement>Internet</Requirement>
        <Requirement>NoPendingUpdates</Requirement>
        <Requirement>UCPDDisabled</Requirement>
        <Requirement>PluggedIn</Requirement>
    </Requirements>
    <UniqueId>c3d4e5f6-7a8b-9c0d-1e2f-3a4b5c6d7e8f</UniqueId>
    <InstallGuide>https://github.com/ArgusWindowsOPTIMIZATION/argus-playbook</InstallGuide>
    <Overhaul>true</Overhaul>
    <UseKernelDriver>false</UseKernelDriver>
    <AllowUnsupportedUpgrades>false</AllowUnsupportedUpgrades>
    <ProductCode>64</ProductCode>
    <EstimatedMinutes>20</EstimatedMinutes>
    <Git>https://github.com/ArgusWindowsOPTIMIZATION/argus-playbook</Git>
    <Website>https://github.com/ArgusWindowsOPTIMIZATION</Website>
    <SupportsISO>false</SupportsISO>
    <OOBE>
        <BulletPoints>
            <BulletPoint Icon="Rocket" Title="Performance" Description="Carefully selected optimizations for responsiveness and reduced background activity."/>
            <BulletPoint Icon="Lock" Title="Privacy" Description="Reduced telemetry and tracking while maintaining security and update functionality."/>
            <BulletPoint Icon="Privacy" Title="Auditability" Description="Every change is documented, reversible, and open to inspection."/>
        </BulletPoints>
        <Internet>Force</Internet>
    </OOBE>
    <FeaturePages>
        <CheckboxPage IsRequired="true" Description="Power and display settings.">
            <Options>
                <CheckboxOption>
                    <Text>High performance power plan</Text>
                    <Name>power-high-performance</Name>
                </CheckboxOption>
                <CheckboxOption>
                    <Text>Disable hibernation</Text>
                    <Name>power-disable-hibernation</Name>
                </CheckboxOption>
                <CheckboxOption>
                    <Text>Disable display timeout (AC)</Text>
                    <Name>power-no-display-timeout</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="true" Description="Privacy and telemetry settings.">
            <Options>
                <CheckboxOption>
                    <Text>Reduce telemetry</Text>
                    <Name>privacy-reduce-telemetry</Name>
                </CheckboxOption>
                <CheckboxOption>
                    <Text>Disable advertising ID</Text>
                    <Name>privacy-disable-ad-id</Name>
                </CheckboxOption>
                <CheckboxOption>
                    <Text>Disable tailored experiences</Text>
                    <Name>privacy-no-tailored</Name>
                </CheckboxOption>
                <CheckboxOption>
                    <Text>Disable activity history</Text>
                    <Name>privacy-no-activity-history</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="true" Description="Gaming optimizations.">
            <Options>
                <CheckboxOption>
                    <Text>Enable Game Mode</Text>
                    <Name>gaming-game-mode</Name>
                </CheckboxOption>
                <CheckboxOption>
                    <Text>Enable hardware-accelerated GPU scheduling</Text>
                    <Name>gaming-hags</Name>
                </CheckboxOption>
                <CheckboxOption>
                    <Text>Optimize fullscreen behavior</Text>
                    <Name>gaming-fullscreen-opt</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="true" Description="Developer workflow settings.">
            <Options>
                <CheckboxOption>
                    <Text>Enable Developer Mode</Text>
                    <Name>dev-developer-mode</Name>
                </CheckboxOption>
                <CheckboxOption>
                    <Text>Enable long paths</Text>
                    <Name>dev-long-paths</Name>
                </CheckboxOption>
                <CheckboxOption>
                    <Text>Configure PowerShell execution policy</Text>
                    <Name>dev-powershell-config</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="true" Description="Explorer and UI customization - part 1.">
            <Options>
                <CheckboxOption>
                    <Text>Show file extensions</Text>
                    <Name>ui-show-extensions</Name>
                </CheckboxOption>
                <CheckboxOption>
                    <Text>Show hidden files</Text>
                    <Name>ui-show-hidden</Name>
                </CheckboxOption>
                <CheckboxOption>
                    <Text>Compact mode</Text>
                    <Name>ui-compact-mode</Name>
                </CheckboxOption>
                <CheckboxOption>
                    <Text>Disable transparency effects</Text>
                    <Name>ui-no-transparency</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="true" Description="Explorer and UI customization - part 2.">
            <Options>
                <CheckboxOption>
                    <Text>Disable animations</Text>
                    <Name>ui-no-animations</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="true" Description="AppX package management. Keep everything is recommended for compatibility.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Keep everything (recommended)</Text>
                    <Name>appx-keep</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove common consumer apps</Text>
                    <Name>appx-balanced</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Remove additional apps (aggressive)</Text>
                    <Name>appx-aggressive</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="true" Description="Background service optimization.">
            <Options>
                <CheckboxOption>
                    <Text>Optimize background services</Text>
                    <Name>services-optimize</Name>
                </CheckboxOption>
                <CheckboxOption>
                    <Text>Disable unnecessary scheduled tasks</Text>
                    <Name>tasks-optimize</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <RadioPage IsRequired="false" DefaultOption="security-default" Description="WARNING: Advanced options are not recommended for most users.">
            <Options>
                <RadioOption>
                    <Text>Default (keep all security features)</Text>
                    <Name>security-default</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Hardened (extra security hardening)</Text>
                    <Name>security-hardened</Name>
                </RadioOption>
            </Options>
        </RadioPage>
    </FeaturePages>
</Playbook>
