<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>Argus</Name>
    <Username>AngKool-Dev</Username>
    <Title>Argus</Title>
    <ShortDescription>Safe Windows 10/11 optimization.</ShortDescription>
    <Description>Argus removes consumer bloatware, hardens privacy, and applies UI/gaming tweaks.</Description>
    <Details>Privacy telemetry reduction, UI tweaks, gaming optimizations, developer settings, optional component removal, and optional Brave browser installation.</Details>
    <Version>2.0.0</Version>
    <UpgradableFrom>
        <string>1.0.0</string>
        <string>1.1.0</string>
    </UpgradableFrom>
    <Overhaul>true</Overhaul>
    <AllowUnsupportedUpgrades>false</AllowUnsupportedUpgrades>
    <UniqueId>c3d4e5f6-7a8b-9c0d-1e2f-3a4b5c6d7e8f</UniqueId>
    <EstimatedMinutes>15</EstimatedMinutes>
    <SupportedBuilds>
        <string>19041</string>
        <string>19042</string>
        <string>19043</string>
        <string>19044</string>
        <string>19045</string>
        <string>22000</string>
        <string>22621</string>
        <string>22631</string>
        <string>26100</string>
        <string>26200</string>
        <string>26300</string>
    </SupportedBuilds>
    <Requirements>
        <Requirement>DefenderToggled</Requirement>
        <Requirement>NoAntivirus</Requirement>
        <Requirement>Internet</Requirement>
        <Requirement>NoPendingUpdates</Requirement>
        <Requirement>PluggedIn</Requirement>
    </Requirements>
    <Website>https://github.com/ArgusWindowsOPTIMIZATION/argus-playbook</Website>
    <ProgressText>Argus is optimizing your system. Please do not restart your PC in the meantime and ensure all apps are closed during the installation process.</ProgressText>
    <FeaturePages>
        <CheckboxPage IsRequired="true" Description="Privacy and telemetry settings.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Reduce telemetry</Text>
                    <Name>privacy-reduce-telemetry</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Disable advertising ID</Text>
                    <Name>privacy-disable-ad-id</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Disable tailored experiences</Text>
                    <Name>privacy-no-tailored</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Disable activity history</Text>
                    <Name>privacy-no-activity-history</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="true" Description="Gaming optimizations.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Enable Game Mode</Text>
                    <Name>gaming-game-mode</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Enable hardware-accelerated GPU scheduling</Text>
                    <Name>gaming-hags</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Optimize fullscreen behavior</Text>
                    <Name>gaming-fullscreen-opt</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="true" Description="Developer workflow settings.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Enable Developer Mode</Text>
                    <Name>dev-developer-mode</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Enable long paths</Text>
                    <Name>dev-long-paths</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Configure PowerShell execution policy</Text>
                    <Name>dev-powershell-config</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="true" Description="Explorer and UI customization - part 1.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Show file extensions</Text>
                    <Name>ui-show-extensions</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Show hidden files</Text>
                    <Name>ui-show-hidden</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Compact mode</Text>
                    <Name>ui-compact-mode</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Disable transparency effects</Text>
                    <Name>ui-no-transparency</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="true" Description="Explorer and UI customization - part 2.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Disable animations</Text>
                    <Name>ui-no-animations</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="true" Description="AppX package management. Keep everything is recommended for compatibility.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Keep everything (recommended)</Text>
                    <Name>appx-keep</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove common consumer apps</Text>
                    <Name>appx-balanced</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Remove additional apps (aggressive)</Text>
                    <Name>appx-aggressive</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <CheckboxPage IsRequired="false" Description="Remove core components. NOT recommended for production — Edge removal may break Windows 11 shell, Search, Settings, and WebView2 apps.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Remove Microsoft Edge</Text>
                    <Name>remove-edge</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Remove Microsoft Store</Text>
                    <Name>remove-store</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Remove Copilot / AI</Text>
                    <Name>remove-ai</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Remove OneDrive</Text>
                    <Name>remove-onedrive</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
    </FeaturePages>
</Playbook>
