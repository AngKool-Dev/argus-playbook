---
title: Argus Windows Playbook
description: Main entry point for all Argus Windows Playbook configurations
privilege: Admin
actions:
  - !writeStatus: {status: "Recording system baseline"}
  - !task: {path: 'Tasks\phase1-prepare.yml'}

  - !writeStatus: {status: "Creating backup"}
  - !cmd:
      exeDir: true
      command: 'powershell -NoP -ExecutionPolicy Bypass -File .\Scripts\backup.ps1'
      wait: true
      runas: currentUserElevated
      weight: 50

  - !writeStatus: {status: "Applying privacy settings"}
  - !task: {path: 'Tasks\phase2-strip.yml'}

  - !writeStatus: {status: "Applying privacy hardening"}
  - !task: {path: 'Tasks\phase3-harden.yml'}

  - !writeStatus: {status: "Applying gaming settings"}
  - !task: {path: 'Tasks\phase4-gaming.yml'}

  - !writeStatus: {status: "Applying developer settings"}
  - !task: {path: 'Tasks\phase5-apply.yml'}

  - !writeStatus: {status: "Applying extended tweaks"}
  - !task: {path: 'Tasks\phase6-extended.yml'}

  - !writeStatus: {status: "Finalizing"}
  - !task: {path: 'Tasks\phase7-privacy.yml'}

  - !cmd:
      exeDir: true
      command: 'Scripts\finalize.cmd'
      wait: true
      ignoreErrors: true
