---
title: Argus Windows Playbook
description: Main entry point for all Argus Windows Playbook configurations
privilege: TrustedInstaller
actions:

  - !writeStatus: {status: "Recording system baseline"}
  - !task: {path: 'Tasks\core\baseline.yml'}

  - !writeStatus: {status: "Creating backup"}
  - !cmd:
    exeDir: true
    command: 'powershell -NoP -ExecutionPolicy Bypass -File .\Scripts\backup.ps1'
    wait: true
    runas: currentUserElevated
    weight: 50

  - !writeStatus: {status: "Applying core optimizations"}
  - !task: {path: 'Tasks\core\start.yml'}

  - !writeStatus: {status: "Applying privacy settings"}
  - !task: {path: 'Tasks\privacy\telemetry.yml'}

  - !writeStatus: {status: "Applying performance settings"}
  - !task: {path: 'Tasks\performance\tweaks.yml'}

  - !writeStatus: {status: "Applying gaming settings"}
  - !task: {path: 'Tasks\gaming\tweaks.yml'}

  - !writeStatus: {status: "Applying developer settings"}
  - !task: {path: 'Tasks\developer\settings.yml'}

  - !writeStatus: {status: "Applying UI settings"}
  - !task: {path: 'Tasks\registry\explorer\ui.yml'}

  - !writeStatus: {status: "Optimizing services"}
  - !task: {path: 'Tasks\services\optimize.yml'}

  - !writeStatus: {status: "Optimizing scheduled tasks"}
  - !task: {path: 'Tasks\services\tasks.yml'}

  - !writeStatus: {status: "Managing AppX packages"}
  - !task: {path: 'Tasks\packages\appx.yml'}

  - !writeStatus: {status: "Applying network settings"}
  - !task: {path: 'Tasks\networking\tweaks.yml'}

  - !writeStatus: {status: "Applying security settings"}
  - !task: {path: 'Tasks\registry\security\hardening.yml'}

  - !writeStatus: {status: "Finalizing"}
  - !cmd:
    exeDir: true
    command: 'powershell -NoP -ExecutionPolicy Bypass -File .\Scripts\finalize.cmd'
    ignoreErrors: true
    weight: 10
