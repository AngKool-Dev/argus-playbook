---
privilege: TrustedInstaller
title: Networking Tweaks
description: Network settings and optimizations
actions:
  - !writeStatus: {status: "Applying network settings"}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\ServiceProvider', value: 'EnableMulticast', type: REG_DWORD, data: '0'}
  - !powerShell:
    command: >-
      Get-NetAdapter | ForEach-Object {
        Set-NetNetBIOSSetting -InterfaceAlias $_.Name -Setting Disable
      }
    wait: true
    runas: currentUserElevated
    errorAction: Ignore
    weight: 15
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', value: 'RestrictAnonymous', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', value: 'RestrictAnonymousSAM', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters', value: 'SMB1', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters', value: 'EnablePMTUDiscovery', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters', value: 'EnablePMTUBHDetect', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters', value: 'NonBestEffortLimit', type: REG_DWORD, data: '0'}
