---
privilege: TrustedInstaller
title: Telemetry and Privacy
description: Privacy settings that can be independently toggled
actions:
  - !writeStatus: {status: "Configuring privacy settings"}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', value: 'AllowTelemetry', type: REG_DWORD, data: '1', option: 'privacy-reduce-telemetry'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', value: 'MaxTelemetryAllowed', type: REG_DWORD, data: '1', option: 'privacy-reduce-telemetry'}
  - !registryValue: {path: 'HKCU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo', value: 'Enabled', type: REG_DWORD, data: '0', option: 'privacy-disable-ad-id'}
  - !registryValue: {path: 'HKCU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'TailoredExperiencesWithDiagnosticDataEnabled', type: REG_DWORD, data: '0', option: 'privacy-no-tailored'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System', value: 'EnableActivityFeed', type: REG_DWORD, data: '0', option: 'privacy-no-activity-history'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System', value: 'PublishUserActivities', type: REG_DWORD, data: '0', option: 'privacy-no-activity-history'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System', value: 'UploadUserActivities', type: REG_DWORD, data: '0', option: 'privacy-no-activity-history'}
  - !registryValue: {path: 'HKCU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-338389Enabled', type: REG_DWORD, data: '0', option: 'privacy-no-tailored'}
  - !registryValue: {path: 'HKCU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SubscribedContent-310093Enabled', type: REG_DWORD, data: '0', option: 'privacy-no-tailored'}
  - !registryValue: {path: 'HKCU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'FeatureManagementEnabled', type: REG_DWORD, data: '0', option: 'privacy-no-tailored'}
  - !registryValue: {path: 'HKCU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SoftLandingEnabled', type: REG_DWORD, data: '0', option: 'privacy-no-tailored'}
  - !registryValue: {path: 'HKU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\WindowsUpdate\UX\Settings', value: 'NumberOfSIUFInPeriod', type: REG_DWORD, data: '0', option: 'privacy-reduce-telemetry'}
  - !registryValue: {path: 'HKU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\WindowsUpdate\UX\Settings', value: 'PeriodInDays', type: REG_DWORD, data: '0', option: 'privacy-reduce-telemetry'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsSearch', value: 'AllowCortana', type: REG_DWORD, data: '0', option: 'privacy-disable-cortana'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsSearch', value: 'CortanaConsent', type: REG_DWORD, data: '0', option: 'privacy-disable-cortana'}
  - !registryValue: {path: 'HKU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'Start_TrackProgs', type: REG_DWORD, data: '0', option: 'privacy-no-activity-history'}
  - !service: {name: 'DiagTrack', operation: change, startup: 4, option: 'privacy-reduce-telemetry'}
