---
privilege: TrustedInstaller
title: Security Hardening
description: Optional security hardening settings
actions:
  - !writeStatus: {status: "Applying security settings"}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender', value: 'DisableRealtimeMonitoring', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System', value: 'EnableSecureBoot', type: REG_DWORD, data: '1', option: 'security-hardened'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard', value: 'EnableVirtualizationBasedSecurity', type: REG_DWORD, data: '1', option: 'security-hardened'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'EnableLUA', type: REG_DWORD, data: '1', option: 'security-hardened'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard', value: 'EnableVirtualizationBasedSecurity', type: REG_DWORD, data: '1', option: 'security-hardened'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System', value: 'RequirePlatformSecurityFeatures', type: REG_DWORD, data: '1', option: 'security-hardened'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppLocker\FOD', value: 'ApplicationGuardEnabled', type: REG_DWORD, data: '1', option: 'security-hardened'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', value: 'LmCompatibilityLevel', type: REG_DWORD, data: '5', option: 'security-hardened'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters', value: 'RequireSecuritySignature', type: REG_DWORD, data: '1', option: 'security-hardened'}
