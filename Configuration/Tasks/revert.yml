---
privilege: TrustedInstaller
title: Rollback Tweaks
description: Rollback tweaks for previous versions of Argus Windows Playbook
privilege: TrustedInstaller
onUpgrade: true
actions:

  - !writeStatus: {status: "Removing outdated changes"}

  - !registryValue: {path: 'Tasks\HKLM\SYSTEM\ControlSet001\Control\Session Manager', value: 'HeapDeCommitFreeBlockThreshold', type: REG_DWORD, data: '0', operation: delete}

  - !registryValue: {path: 'Tasks\HKCU\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications', value: 'NoToastApplicationNotification', type: REG_DWORD, data: '0', operation: delete}

  - !registryValue: {path: 'Tasks\HKLM\SOFTWARE\Policies\Microsoft\Windows\System', value: 'EnableActivityFeed', type: REG_DWORD, data: '0', operation: delete}
  - !registryValue: {path: 'Tasks\HKLM\SOFTWARE\Policies\Microsoft\Windows\System', value: 'PublishUserActivities', type: REG_DWORD, data: '0', operation: delete}
  - !registryValue: {path: 'Tasks\HKLM\SOFTWARE\Policies\Microsoft\Windows\System', value: 'UploadUserActivities', type: REG_DWORD, data: '0', operation: delete}

  - !registryValue: {path: 'Tasks\HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', value: 'AllowTelemetry', type: REG_DWORD, data: '0', operation: delete}
  - !registryValue: {path: 'Tasks\HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection', value: 'AllowTelemetry', type: REG_DWORD, data: '0', operation: delete}

  - !registryValue: {path: 'Tasks\HKCU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo', value: 'Enabled', type: REG_DWORD, data: '0', operation: delete}

  - !registryValue: {path: 'Tasks\HKCU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'FeatureManagementEnabled', type: REG_DWORD, data: '0', operation: delete}
  - !registryValue: {path: 'Tasks\HKCU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', value: 'SoftLandingEnabled', type: REG_DWORD, data: '0', operation: delete}

  - !service: {name: 'SysMain', operation: change, startup: 2}
  - !service: {name: 'WSearch', operation: change, startup: 2}
  - !service: {name: 'DoSvc', operation: change, startup: 2}
  - !service: {name: 'DiagTrack', operation: change, startup: 2}
  - !service: {name: 'BITS', operation: change, startup: 2}

  - !registryValue: {path: 'Tasks\HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'LaunchTo', type: REG_DWORD, data: '0', operation: delete}

  - !registryValue: {path: 'Tasks\HKCU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'ShowTaskViewButton', type: REG_DWORD, data: '0', operation: delete}
  - !registryValue: {path: 'Tasks\HKCU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'UseCompactMode', type: REG_DWORD, data: '0', operation: delete}

  - !registryValue: {path: 'Tasks\HKCU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize', value: 'EnableTransparency', type: REG_DWORD, data: '0', operation: delete}

