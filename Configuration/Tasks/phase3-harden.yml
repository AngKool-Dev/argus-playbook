  - !writeStatus: {status: "Disabling Telemetry Tasks"}
  - !powerShell:
      wait: true
      errorAction: Ignore
      command: |
        $tasks = @(
          '\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser',
          '\Microsoft\Windows\Application Experience\StartupAppTask',
          '\Microsoft\Windows\Customer Experience Improvement Program\Consolidator',
          '\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip',
          '\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector',
          '\Microsoft\Windows\Feedback\Siuf\DmClient',
          '\Microsoft\Windows\Feedback\Siuf\DmClientOnScenarioDownload',
          '\Microsoft\Windows\Flighting\FeatureConfig\ReconcileFeatures',
          '\Microsoft\Windows\Flighting\FeatureConfig\UsageDataFlushing',
          '\Microsoft\Windows\Flighting\FeatureConfig\UsageDataReporting',
          '\Microsoft\Windows\Power Efficiency Diagnostics\AnalyzeSystem',
          '\Microsoft\Windows\Windows Error Reporting\QueueReporting',
          '\Microsoft\Windows\DiskFootprint\Diagnostics',
          '\Microsoft\Windows\Device Information\Device',
          '\Microsoft\Windows\Device Information\Device User',
          '\Microsoft\Windows\Diagnosis\Scheduled',
          '\Microsoft\Windows\Diagnosis\RecommendedTroubleshootingScanner',
          '\Microsoft\Windows\MemoryDiagnostic\ProcessMemoryDiagnosticEvents',
          '\Microsoft\Windows\MemoryDiagnostic\RunFullMemoryDiagnostic',
          '\Microsoft\Windows\PI\Sqm-Tasks',
          '\Microsoft\Windows\WindowsAI\Recall\PolicyConfiguration',
          '\Microsoft\Windows\WindowsAI\Settings\InitialConfiguration',
          '\Microsoft\Windows\Input\LocalUserSyncDataAvailable',
          '\Microsoft\Windows\Input\MouseSyncDataAvailable'
        )
        $skipped = @()
        foreach ($t in $tasks) {
          try {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = 'schtasks.exe'
            $q = [char]34
            $psi.Arguments = '/Change /TN ' + $q + $t + $q + ' /DISABLE'
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $proc = [System.Diagnostics.Process]::Start($psi)
            if (-not $proc.WaitForExit(15000)) {
              try { $proc.Kill() } catch {}
              $skipped += ($t + ' [timed out]')
            } elseif ($proc.ExitCode -ne 0) {
              $err = ''
              try { $err = ($proc.StandardError.ReadToEnd() -replace '\r?\n',' ').Trim() } catch {}
              $skipped += ($t + ' [exit ' + $proc.ExitCode + '] ' + $err)
            }
          } catch { $skipped += $t }
        }
        if ($skipped.Count -gt 0) {
          try {
            $dir = Join-Path $env:windir 'Argus'
            if (-not (Test-Path $dir)) { New-Item -Path $dir -ItemType Directory -Force -ErrorAction SilentlyContinue | Out-Null }
            $log = Join-Path $dir 'skipped-tasks.txt'
            ((Get-Date -Format s) + ' - Task Scheduler did not respond for:') | Out-File -FilePath $log -Append -Encoding utf8
            $skipped | Out-File -FilePath $log -Append -Encoding utf8
          } catch {}
        }
        $global:LASTEXITCODE = 0
