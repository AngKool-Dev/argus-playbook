---
privilege: TrustedInstaller
title: AppX Management
description: Manages AppX packages based on user selection
actions:
  - !writeStatus: {status: "Managing AppX packages"}
  - !powerShell:
    command: >-
      $packages = (Get-AppxPackage).PackageFamilyName | Sort-Object
      $packages | Out-File "$env:ProgramData\ArgusPlaybook\appx-before.txt" -Encoding utf8
    wait: true
    runas: currentUserElevated
    weight: 10

  - !writeStatus: {status: "Keeping all AppX packages"}
  - !task: {path: 'Tasks\packages\keep.yml', option: 'appx-keep'}

  - !writeStatus: {status: "Removing balanced AppX list"}
  - !task: {path: 'Tasks\packages\balanced.yml', option: 'appx-balanced'}

  - !writeStatus: {status: "Removing aggressive AppX list"}
  - !task: {path: 'Tasks\packages\aggressive.yml', option: 'appx-aggressive'}

  - !writeStatus: {status: "Deprovisioning removed packages"}
  - !powerShell:
    command: >-
      $deprovisioned = @(
        'MicrosoftTeams*',
        'MSTeams*',
        'Microsoft.Copilot*',
        'Clipchamp.Clipchamp*',
        'Disney.37853FC22B2CE*',
        'SpotifyAB.SpotifyMusic*',
        'Microsoft.549981C3F5F10*',
        'Microsoft.XboxApp*',
        'microsoft.windowscommunicationsapps*',
        'Microsoft.MSPaint*',
        'Microsoft.Getstarted*',
        'Microsoft.ZuneVideo*',
        'MicrosoftCorporationII.MicrosoftFamily*',
        'Microsoft.MixedReality.Portal*',
        'Microsoft.Windows.DevHome*',
        'Microsoft.BingWeather*',
        'Microsoft.BingNews*',
        'Microsoft.BingSports*',
        'Microsoft.BingFinance*',
        'Microsoft.3DBuilder*',
        'Microsoft.AppConnector*',
        'Microsoft.BingFoodAndDrink*',
        'Microsoft.BingHealthAndFitness*',
        'Microsoft.BingTravel*',
        'Microsoft.WindowsMaps*',
        'Microsoft.Office.OneNote*',
        'Microsoft.People*',
        'Microsoft.SkypeApp*',
        'Microsoft.Wallet*',
        'Microsoft.WindowsAlarms*',
        'Microsoft.WindowsCamera*',
        'Microsoft.WindowsPhone*',
        'Microsoft.WindowsSoundRecorder*',
        'Microsoft.ZuneMusic*'
      )
      $packages = Get-AppxPackage -AllUsers 2>&1 | Where-Object { $_ -is [Microsoft.Windows.Appx.Package] }
      foreach ($pattern in $deprovisioned) {
        $match = $packages | Where-Object { $_.Name -like $pattern }
        if ($match) {
          $match | Remove-AppxPackage -ErrorAction SilentlyContinue
        }
      }
    wait: true
    runas: currentUserElevated
    errorAction: Ignore
    weight: 30
