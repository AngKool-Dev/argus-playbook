  - !scheduledTask: {name: '\Microsoft\Windows\Customer Experience Improvement Program\Consolidator', operation: disable, option: 'tasks-optimize'}
  - !scheduledTask: {name: '\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip', operation: disable, option: 'tasks-optimize'}
  - !scheduledTask: {name: '\Microsoft\Windows\Defrag\ScheduledDefrag', operation: disable, option: 'tasks-optimize'}
  - !scheduledTask: {name: '\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector', operation: disable, option: 'tasks-optimize'}
