---
privilege: TrustedInstaller
title: Developer Settings
description: Developer workflow configurations
actions:
  - !writeStatus: {status: "Applying developer settings"}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock', value: 'AllowDevelopmentWithoutDevLicense', type: REG_DWORD, data: '1', option: 'dev-developer-mode'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'LongPathsEnabled', type: REG_DWORD, data: '1', option: 'dev-long-paths'}
  - !powerShell:
    command: >-
      $progressPreference = 'silentlyContinue'
      if (!(Get-ExecutionPolicy -Scope CurrentUser)) {
        Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force
      }
    wait: true
    runas: currentUser
    errorAction: Ignore
    option: 'dev-powershell-config'
    weight: 10
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Defender', value: 'SpyNetReporting', type: REG_DWORD, data: '0', option: 'dev-developer-mode'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Defender', value: 'SubmitSamplesConsent', type: REG_DWORD, data: '0', option: 'dev-developer-mode'}
  - !powerShell:
    command: 'wsl --install --no-distribution'
    wait: true
    runas: currentUserElevated
    errorAction: Ignore
    option: 'dev-developer-mode'
    weight: 20
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', value: 'AllowTelemetry', type: REG_DWORD, data: '1', option: 'dev-developer-mode'}
  - !registryValue: {path: 'HKCU\.DEFAULT\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo', value: 'Enabled', type: REG_DWORD, data: '0', option: 'dev-developer-mode'}
